spring.application.name=SWINGS

logging.level.root=info
logging.level.com.exam=info
logging.level.org.springframework=info

server.port=${PORT:8090}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/swings}

# 파일 업로드 경로를 외부화
file.upload-dir=${FILE_UPLOAD_DIR:/tmp/uploads/}

# MySQL 연동
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/swings?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA
# JPA가 자동으로 생성하는 SQL문 보기
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:warn}
# 위의 SQL문을 보기 좋게 보기
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type=${HIBERNATE_TYPE_LOG_LEVEL:warn}

# 자동으로 테이블 생성( create: drop+create )
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# 자동으로 생성된 SQL문에서 사용되는 파라미터 보기
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:warn}

# 트랜잭션 처리후에 Connection 사용하고 pool에 반환여부( 기본값은 true이고 반환안함 )
spring.jpa.open-in-view=false


# @Entity 보다 먼저 data.sql이 실행되기 때문에 defer 시킴.
spring.jpa.defer-datasource-initialization=true

# 외부파일 data.sql 실행
# always는 프로그램실행시 매번 실행.
spring.sql.init.mode=${SQL_INIT_MODE:never}

spring.web.resources.add-mappings=true
spring.web.resources.cors.allowed-origins=${FRONTEND_BASE_URL:http://localhost:5173}
spring.web.resources.cors.allowed-methods=GET, POST, PUT, DELETE

# 스네이크 변환법으로 변경
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# JPA 버전이 낮은 경우에 지정했음. 실제 접속하는 DB용 SQL문 작성위한 정보임.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
spring.mvc.format.date=yyyy-MM-dd

jwt.secret=${JWT_SECRET:}
jwt.secret-file=${JWT_SECRET_FILE:}


# JWT 만료시간 15분 (밀리초)
jwt.expiration=900000

# Redis 설정
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.redis.enabled=${REDIS_ENABLED:false}
app.demo-data.enabled=${DEMO_DATA_ENABLED:true}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}
app.backend-base-url=${BACKEND_BASE_URL:http://localhost:8090/swings}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173/swings}

# API 기능 점검
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator

#토스 결제 키
toss.secret-key=${TOSS_SECRET_KEY:}
toss.secret-key-file=${TOSS_SECRET_KEY_FILE:}

#구글 로그인 키
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-id-file=${GOOGLE_OAUTH_CLIENT_ID_FILE:}

# Firebase JSON 키
firebase.key-path=${FIREBASE_KEY_PATH:}
firebase.key-json=${FIREBASE_KEY_JSON:}

mail.host=${MAIL_HOST:smtp.gmail.com}
mail.port=${MAIL_PORT:587}
mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}

# 파일 업로드 크기 제한 (예: 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
